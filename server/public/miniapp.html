<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ALFA SMS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/qrcode.js"></script>
<style>
  :root{
    --bg:#eef1f6; --card:#ffffff; --card2:#fbfcfe; --input-bg:#ffffff; --btn-sec:#eef2f8;
    --ink:#141b2d; --muted:#6b7480;
    --line:#e4e8ef; --accent:#2f7ae5; --accent2:#6a5cff; --accent-ink:#fff;
    --green:#34c759; --green-dark:#28a745; --danger:#e5484d; --danger-bg:#fdecec;
    --shadow:0 1px 3px rgba(20,27,45,.08),0 1px 2px rgba(20,27,45,.05);
    --shadow-lg:0 10px 30px rgba(47,122,229,.18);
  }
  :root[data-theme="dark"]{
    --bg:#0e131c; --card:#18202e; --card2:#1e2837; --input-bg:#0f1723; --btn-sec:#26303f;
    --ink:#e8edf5; --muted:#93a0b3;
    --line:#2a3547; --accent:#4f8ef7; --accent2:#8a7bff; --accent-ink:#fff;
    --green:#34c759; --green-dark:#3ddc84; --danger:#ff6166; --danger-bg:#3a2326;
    --shadow:0 1px 3px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.4);
    --shadow-lg:0 10px 30px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 30px;min-height:100vh;display:flex;flex-direction:column;position:relative}
  .themetgl{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:var(--card);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;
    box-shadow:var(--shadow);z-index:20;user-select:none}
  #content{flex:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .row{display:flex;align-items:center;gap:12px}
  .row.between{justify-content:space-between}
  .grow{flex:1;min-width:0}
  .ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---- Logo ---- */
  .logo{display:flex;align-items:center;justify-content:center;margin:16px 0 6px}
  .logo .wm{display:flex;flex-direction:column;line-height:1;align-items:center}
  .logo .wm .a{font-size:26px;font-weight:800;letter-spacing:.10em;
    background:linear-gradient(90deg,#2f7ae5,#6a5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo .wm .by{font-size:11px;font-weight:600;letter-spacing:.18em;color:var(--muted);margin-top:5px;text-transform:uppercase}
  .subttl{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:16px}

  label.field{display:block;font-size:12px;color:var(--muted);margin:14px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  input[type=text],input[type=tel],input[type=number],input[type=time],input[type=datetime-local],textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--input-bg);color:var(--ink);font-family:inherit}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;min-height:44px}

  .btn{appearance:none;border:none;border-radius:11px;padding:13px 16px;font-size:15px;font-weight:600;cursor:pointer;
    background:linear-gradient(135deg,#2f7ae5,#6a5cff);color:#fff;width:100%;box-shadow:var(--shadow)}
  .btn:active{opacity:.9}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .btn.sec{background:var(--btn-sec);color:var(--ink);box-shadow:none}
  .btn.ghost{background:transparent;color:var(--accent);box-shadow:none;padding:9px}
  .btn.danger{background:var(--danger-bg);color:var(--danger);box-shadow:none}
  .btn.small{width:auto;padding:8px 12px;font-size:13px}
  .btn.nav{display:flex;align-items:center;justify-content:space-between;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
  .btn.nav .arw{color:var(--muted)}
  .chip{display:inline-block;padding:8px 0;flex:1;text-align:center;border:1px solid var(--line);border-radius:9px;background:var(--input-bg);font-size:14px;cursor:pointer;font-weight:600}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px} .center{text-align:center}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px}
  .badge.on{background:#e7f8ec;color:var(--green-dark)} .badge.off{background:var(--card2);color:var(--muted)}
  .badge.run{background:#e8f0fe;color:var(--accent)} .badge.err{background:var(--danger-bg);color:var(--danger)}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

  .sw{position:relative;display:inline-block;width:50px;height:30px;flex:0 0 auto}
  .sw input{opacity:0;width:0;height:0}
  .sw .slider{position:absolute;inset:0;background:#e6e9ef;border:1px solid #d3d8e0;border-radius:30px;transition:.2s}
  .sw .slider:before{content:"";position:absolute;height:24px;width:24px;left:3px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .sw input:checked + .slider{background:var(--green);border-color:var(--green)}
  .sw input:checked + .slider:before{transform:translateX(20px)}

  .hero{background:linear-gradient(135deg,#2f7ae5,#6a5cff);color:#fff;border:none}
  .hero .sw .slider{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.5)}
  .hero .sw input:checked + .slider{background:var(--green);border-color:var(--green)}
  .hero .ttl{font-size:16px;font-weight:700} .hero .desc{font-size:12px;opacity:.92;margin-top:2px}

  .devrow{display:flex;align-items:center;gap:12px;padding:14px 4px;cursor:pointer}
  .devrow + .devrow{border-top:1px solid var(--line)}
  .devrow .nm{font-size:16px;font-weight:600}
  .payblock{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;cursor:pointer;background:var(--card2)}
  .payblock .pn{font-weight:700;margin-bottom:4px}
  .kv{font-size:13px;color:var(--muted)} .kv b{color:var(--ink);font-weight:600}

  .windows-list .wrow{display:flex;align-items:center;gap:8px;margin-top:8px}
  .winblock{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;background:var(--card2)}
  .trow{display:inline-flex;align-items:center;gap:3px}
  .tnum{width:52px;padding:9px 4px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--input-bg);color:var(--ink);font-size:15px}
  .tsep{color:var(--muted);font-weight:700}
  .tlbl{display:inline-block;width:58px;font-size:13px;color:var(--muted)}
  .tunit{font-size:10px;color:var(--muted);text-align:center;width:52px;display:inline-block}
  .qrbox{text-align:center;padding:10px 0}
  .qrbox svg{width:210px;height:210px;background:#fff;border-radius:8px}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.15em;background:var(--card2);padding:8px 12px;border-radius:8px;display:inline-block;margin:6px 0}
  .hidden{display:none}
  hr{border:none;border-top:1px solid var(--line);margin:14px 0}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141b2d;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:.96}
  .backdrop{position:fixed;inset:0;background:rgba(20,27,45,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:40}
  .modal{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:360px}
  .screen-title{font-size:20px;font-weight:800;margin:4px 2px 14px}

  /* footer */
  .foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);text-align:center}
  .foot .prod{font-size:13px;color:var(--muted)}
  .foot .prod b{color:var(--ink)}
  .foot .support{margin-top:10px;display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
    border-radius:22px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;box-shadow:var(--shadow)}
  .adminbar{display:flex;justify-content:flex-end;margin-bottom:4px}
  .adminbtn{font-size:12px;font-weight:600;color:#a44bff;background:#f4f0ff;border:1px solid #e6ddff;border-radius:20px;padding:6px 12px;cursor:pointer}
  .actbanner{background:linear-gradient(135deg,#f7971e,#e8622c);color:#fff;border:none}
  .actbanner .actexit{width:auto;background:#fff;color:#c0510f;box-shadow:none;font-weight:700}

  /* ---- Wiki accordion ---- */
  .wikisec{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
  .wikihead{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;user-select:none;transition:background .15s}
  .wikihead:active{background:var(--card2)}
  .wikiic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:19px;flex:0 0 auto}
  .wikititle{font-weight:700;font-size:14.5px;line-height:1.3}
  .wikisub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .wikichev{margin-left:auto;flex:0 0 auto;color:var(--muted);font-size:13px;transition:transform .25s ease}
  .wikisec.open .wikichev{transform:rotate(180deg)}
  .wikibody{max-height:0;overflow:hidden;transition:max-height .35s ease}
  .wikibodyin{padding:0 16px 16px;opacity:0;transition:opacity .3s ease}
  .wikisec.open .wikibodyin{opacity:1;transition:opacity .3s ease .08s}
  .wikip{font-size:13.5px;line-height:1.6;color:var(--ink);margin-top:8px}
  .wikilist{list-style:none;margin:10px 0 0;padding:0}
  .wikilist li{position:relative;padding-left:18px;margin-top:8px;font-size:13.5px;line-height:1.55;color:var(--ink)}
  .wikilist li:before{content:'';position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--wdot,var(--accent))}
  .wikistep{display:flex;gap:12px;margin-top:16px}
  .wikistep:first-child{margin-top:8px}
  .wikistepnum{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:#fff}
  .wikisteptitle{font-weight:700;font-size:13.5px;color:var(--ink)}
  .wikistepdesc{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.55}
  .wikiexample{background:var(--card2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;
    font-size:12.5px;line-height:1.55;color:var(--ink)}

  /* ---- Dashboard stat tiles ---- */
  .dtiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .dtile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow)}
  .dtval{font-size:24px;font-weight:800}
  .dtlbl{font-size:12px;color:var(--muted);margin-top:2px}

  /* ============ Mobile bottom nav (Telegram mini-app) ============ */
  .wrap.hasnav{padding-bottom:82px}
  .bottomnav{display:none}
  .bottomnav.show{
    display:flex;justify-content:center;gap:4px;
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--card);border-top:1px solid var(--line);
    box-shadow:0 -2px 10px rgba(20,27,45,.08);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  .bnitem{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;
    background:transparent;border:none;padding:6px 4px;border-radius:10px;cursor:pointer;
    color:var(--muted);font-size:11px;font-weight:600}
  .bnitem .bni{font-size:20px;line-height:1}
  .bnitem.on{color:var(--accent)}

  /* ============ Desktop website shell (browser only, never in Telegram) ============ */
  .appbar,.sidebar{display:none}
  @media (min-width:821px){
    .bottomnav{display:none!important}
    .wrap.desktop{max-width:1180px;padding:0 26px 44px}
    /* --- logged-in: top bar + left sidebar + wide content --- */
    .wrap.desktop.authed{display:grid;grid-template-columns:250px minmax(0,1fr);
      grid-template-rows:auto 1fr auto;grid-template-areas:"bar bar" "side main" "side foot";column-gap:32px}
    .wrap.desktop.authed .appbar{grid-area:bar;display:flex;align-items:center;justify-content:space-between;
      padding:18px 2px 15px;border-bottom:1px solid var(--line);margin-bottom:22px;position:sticky;top:0;background:var(--bg);z-index:15}
    .wrap.desktop.authed .sidebar{grid-area:side;display:block;position:sticky;top:84px;align-self:start}
    .wrap.desktop.authed #content{grid-area:main;max-width:900px}
    .wrap.desktop.authed .foot{grid-area:foot;max-width:900px;margin-top:30px}
    .wrap.desktop.authed .themetgl{display:none}
    .wrap.desktop.authed #content .logo{display:none}
    .wrap.desktop.authed #content .adminbar{display:none}
    .wrap.desktop.authed #content .home-logout{display:none}
    .wrap.desktop.authed .screen-title{font-size:26px}
    /* Cards a touch roomier on desktop */
    .wrap.desktop.authed .card{padding:20px 22px}
    /* --- not logged in: centered login --- */
    .wrap.desktop:not(.authed) #content{max-width:470px;margin:26px auto 0}
    .wrap.desktop:not(.authed) .foot{max-width:470px;margin-left:auto;margin-right:auto}
    /* Admin panel stays wide even when the admin owns no token (not "authed"). */
    .wrap.desktop.adminwide:not(.authed) #content{max-width:1060px;margin:16px auto 0}
    .wrap.desktop.adminwide:not(.authed) .foot{max-width:1060px}

    .dbrand{display:flex;flex-direction:column;line-height:1;cursor:pointer}
    .dbrand .da{font-size:23px;font-weight:800;letter-spacing:.10em;
      background:linear-gradient(90deg,#2f7ae5,#6a5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
    .dbrand .dby{font-size:10px;font-weight:600;letter-spacing:.18em;color:var(--muted);margin-top:4px;text-transform:uppercase}
    .dctrls{display:flex;align-items:center;gap:10px}
    .dicon{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);
      cursor:pointer;font-size:17px;box-shadow:var(--shadow)}
    .dbtn{background:var(--btn-sec);color:var(--ink);border:1px solid var(--line);border-radius:10px;
      padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer}
    .dnav{display:flex;flex-direction:column;gap:6px}
    .dlink{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;
      border:1px solid transparent;border-radius:11px;padding:12px 14px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
    .dlink:hover{background:var(--card)}
    .dlink.on{background:var(--card);border-color:var(--line);box-shadow:var(--shadow);color:var(--accent)}
    .dlink .di{width:22px;text-align:center;font-size:16px}
    .dsidefoot{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="themetgl" id="themeBtn" title="Тема">🌙</div>
  <header class="appbar" id="appbar"></header>
  <aside class="sidebar" id="sidebar"></aside>
  <div id="content"></div>
  <div class="foot">
    <div class="prod">Production by <b>Splinter&nbsp;&amp;&nbsp;Sergio</b></div>
    <div class="support" id="supportBtn">🛟 Тех&nbsp;поддержка</div>
  </div>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
if (TG) { try { TG.ready(); TG.expand(); } catch(e){} }
// Desktop = opened in a normal browser (no Telegram WebApp). Auth via web session.
const IS_DESKTOP = !TG;
if (IS_DESKTOP) { const w=document.querySelector('.wrap'); if(w) w.classList.add('desktop'); }

const $ = (s,r=document)=>r.querySelector(s);

// --- Theme (light / dark) ---
function applyTheme(t){
  const dark = t==='dark';
  document.documentElement.setAttribute('data-theme', dark?'dark':'light');
  const btn=document.getElementById('themeBtn'); if(btn) btn.textContent = dark?'☀️':'🌙';
  if(TG){ try{ const bg=dark?'#0e131c':'#eef1f6'; TG.setHeaderColor&&TG.setHeaderColor(bg); TG.setBackgroundColor&&TG.setBackgroundColor(bg); }catch(e){} }
}
let THEME = localStorage.getItem('alfa-theme') || 'light';
applyTheme(THEME);
document.getElementById('themeBtn').onclick=()=>{ THEME = THEME==='dark'?'light':'dark'; localStorage.setItem('alfa-theme',THEME); applyTheme(THEME); };
const el=(tag,props={},...kids)=>{const e=document.createElement(tag);
  for(const k in props){ if(k==='class')e.className=props[k]; else if(k in e)e[k]=props[k]; else e.setAttribute(k,props[k]); }
  for(const k of kids){if(k==null)continue;e.append(k.nodeType?k:document.createTextNode(k));}return e;};
function swWrap(input){const w=el('label',{class:'sw'});w.append(input,el('span',{class:'slider'}));return w;}

let toastTimer=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1900);}

async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); }
    else{
      const ta=el('textarea',{value:text,style:'position:fixed;opacity:0;top:0;left:0'});
      document.body.append(ta); ta.focus(); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    toast('Скопировано');
  }catch(e){ toast('Не удалось скопировать'); }
}

const SUPPORT_URL='https://t.me/sergiogarfield';
$('#supportBtn').onclick=()=>{ if(TG&&TG.openTelegramLink)TG.openTelegramLink(SUPPORT_URL); else window.open(SUPPORT_URL,'_blank'); };
// Build stamp — lets you confirm a deploy actually loaded (bump on each release).
const BUILD='2.13';
try{ const f=document.querySelector('.foot .prod'); if(f) f.append(el('span',{class:'tiny muted',style:'display:block;margin-top:4px;opacity:.7'},'сборка '+BUILD)); }catch(e){}

// --- API ---
// When the admin "enters" a token's cabinet, every request carries this so the
// server edits that token as its owner. Admin endpoints ignore it (real id used).
let ACT_AS=null, ACT_LABEL='';
// Track in-flight writes so the background auto-refresh never clobbers a change
// the user just made with a stale snapshot (the "switches turn on by themselves"
// bug). Any non-GET call counts as a write.
let WRITES_IN_FLIGHT=0, LAST_WRITE_AT=0;
async function api(method,path,body){
  const isWrite = method!=='GET';
  if(isWrite){ WRITES_IN_FLIGHT++; LAST_WRITE_AT=Date.now(); }
  const headers={'Content-Type':'application/json'};
  if(TG&&TG.initData)headers['X-Init-Data']=TG.initData;
  if(ACT_AS)headers['X-Act-As-Token']=ACT_AS;
  try{
    const res=await fetch(path,{method,headers,credentials:'same-origin',body:body!=null?JSON.stringify(body):undefined});
    let data=null;try{data=await res.json();}catch(e){}
    return {code:res.status,data:data||{}};
  } finally {
    if(isWrite){ WRITES_IN_FLIGHT--; LAST_WRITE_AT=Date.now(); }
  }
}

// --- App state + router ---
let STATE=null, IS_ADMIN=false, ADMIN_DATA=null, ADMIN_PAY=null, ADMIN_SIGNALS=null;
let view={name:'home',params:{}};
const stack=[];

function go(name,params={}){ stack.push(view); view={name,params}; render(); syncBackButton(); }
function back(){ if(stack.length){ view=stack.pop(); render(); syncBackButton(); } }
function reset(name,params={}){ stack.length=0; view={name,params}; render(); syncBackButton(); }
function syncBackButton(){ if(!TG||!TG.BackButton)return; if(stack.length){TG.BackButton.show();}else{TG.BackButton.hide();} }
if(TG&&TG.BackButton)TG.BackButton.onClick(()=>back());

function logo(){
  const wm=el('div',{class:'wm'},el('div',{class:'a'},'ALFA'),el('div',{class:'by'},'By CheckOut'));
  return el('div',{class:'logo'},wm);
}

function adminBar(){
  if(!IS_ADMIN)return null;
  const b=el('div',{class:'adminbtn',textContent:'⚙ Админ‑панель'});
  b.onclick=()=>{ loadAdmin().then(()=>go('admin')); };
  return el('div',{class:'adminbar'},b);
}

async function load(){
  const {code,data}=await api('GET','/api/mini/state');
  if(code===401){ if(IS_DESKTOP){ STATE=null; reset('weblogin'); return; } renderError('Нет доступа'); return; }
  if(code!==200){renderError('Не удалось связаться с сервером');return;}
  IS_ADMIN=!!data.isAdmin;
  // Deep link: /#admin opens the admin panel directly (admin only).
  if(IS_ADMIN && location.hash==='#admin'){ STATE=data.needToken?null:data.state; await loadAdmin(); reset('admin'); return; }
  if(data.needToken){ STATE=null; reset(IS_DESKTOP?'weblogin':'token'); return; }
  STATE=data.state; reset('home');
}

// ---------- Schedule (global, applies to all devices) ----------
function renderSchedule(c){
  const sch=Object.assign({intervalSec:15,windows:[],repeatDaily:false,startAtMillis:0,starts:[]},STATE.schedule||{});
  c.append(el('div',{class:'screen-title'},'Настройка интервалов'));
  c.append(el('div',{class:'small muted',style:'margin:-8px 2px 4px'},'Эти настройки применяются ко всем вашим устройствам.'));
  c.append(el('div',{class:'small',style:'margin:0 2px 12px;color:var(--accent);font-weight:600'},'🕒 Время указывается по Москве (МСК, UTC+3).'));

  const interval=el('input',{type:'number',min:'1',value:sch.intervalSec});
  const chips=el('div',{class:'row',style:'gap:8px;margin-top:8px'});
  [5,10,15].forEach(n=>{const ch=el('div',{class:'chip'+(Number(sch.intervalSec)===n?' on':''),textContent:n});
    ch.onclick=()=>{interval.value=n;chips.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));ch.classList.add('on');};chips.append(ch);});

  const winList=el('div',{class:'windows-list'});
  function addWinRow(w){
    const st=timeTriple(w?w.startSec:9*3600);
    const en=timeTriple(w?w.endSec:12*3600);
    const del=el('button',{class:'btn ghost small',textContent:'✕ удалить',style:'color:var(--danger);margin-top:6px'});
    const row=el('div',{class:'winblock'},
      el('div',{class:'row',style:'gap:6px'},el('span',{class:'tlbl'},'Начало'),st),
      el('div',{class:'row',style:'gap:6px;margin-top:8px'},el('span',{class:'tlbl'},'Конец'),en),
      el('div',{class:'tunit',style:'width:auto;margin-top:2px'},'часы : минуты : секунды'),
      del);
    del.onclick=()=>row.remove();
    row._get=()=>({startSec:st._get(),endSec:en._get()});
    winList.append(row);
  }
  (sch.windows||[]).forEach(addWinRow);

  // ---- Scheduled bursts ("залпы") ----
  const startsList=el('div',{});
  function addStartRow(b){
    const t=timeTriple(b?b.atSec:13*3600);
    const cnt=el('input',{type:'number',inputmode:'numeric',min:'1',value:b?b.count:10,class:'tnum',style:'width:64px'});
    const ims=el('input',{type:'number',inputmode:'numeric',min:'0',value:b?b.intervalMs:500,class:'tnum',style:'width:80px'});
    const del=el('button',{class:'btn ghost small',textContent:'✕ удалить',style:'color:var(--danger);margin-top:6px'});
    const row=el('div',{class:'winblock'},
      el('div',{class:'row',style:'gap:6px'},el('span',{class:'tlbl'},'Время'),t),
      el('div',{class:'tunit',style:'width:auto;margin-top:2px'},'часы : минуты : секунды'),
      el('div',{class:'row',style:'gap:8px;margin-top:8px;flex-wrap:wrap'},
        el('span',{class:'tlbl',style:'width:auto'},'СМС:'),cnt,
        el('span',{class:'tlbl',style:'width:auto'},'интервал, мс:'),ims),
      del);
    del.onclick=()=>row.remove();
    row._getBurst=()=>({atSec:t._get(),count:Math.max(1,parseInt(cnt.value,10)||1),intervalMs:Math.max(0,parseInt(ims.value,10)||0)});
    startsList.append(row);
  }
  (sch.starts||[]).forEach(addStartRow);

  const repeat=el('input',{type:'checkbox',checked:!!sch.repeatDaily});

  const save=el('button',{class:'btn',textContent:'Сохранить',style:'margin-top:18px'});
  save.onclick=async()=>{
    const windows=[...winList.querySelectorAll('.winblock')].map(r=>r._get());

function wikiStep(num,title,desc,color,extraNode){
  const textWrap=el('div',{class:'grow'},
    el('div',{class:'wikisteptitle'},title),

  if(extraNode) textWrap.append(extraNode);

function wikiSection(sec,defaultOpen){
  const bodyIn=el('div',{class:'wikibodyin'});
  sec.body(sec.color).forEach(n=>bodyIn.append(n));
  const body=el('div',{class:'wikibody'},bodyIn);
  const chev=el('span',{class:'wikichev'},'⌄');

    el('div',{class:'wikiic',style:`background:${sec.color}22;color:${sec.color}`},sec.icon),
    el('div',{class:'grow'},el('div',{class:'wikititle'},sec.title),el('div',{class:'wikisub'},sec.sub)),
    chev);
  const wrap=el('div',{class:'wikisec',style:`border-left-color:${sec.color}`},head,body);

    wrap.classList.toggle('open',open);
    body.style.maxHeight=open?(bodyIn.scrollHeight+'px'):'0px';

// ---------- Payment editor ----------
function renderPayment(c){
  const d=device(view.params.deviceId); if(!d){back();return;}
  const idx=view.params.index;
  const existing=(idx!=null)?d.payments[idx]:null;
  const isNew=existing==null;
  c.append(el('div',{class:'screen-title'},isNew?'Новый платёж':(existing.name||'Платёж')));

  const req=el('textarea',{value:existing?existing.requisites:'',placeholder:'Реквизиты'});
  const amt=el('input',{type:'text',inputmode:'decimal',value:existing?existing.amount:'',placeholder:'Только число, напр. 5000'});
  // Keep the amount field numeric: digits and at most one decimal separator.
  amt.oninput=()=>{ let v=amt.value.replace(/,/g,'.').replace(/[^0-9.]/g,''); const i=v.indexOf('.'); if(i!==-1)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,''); amt.value=v; };
  const multi=el('input',{type:'checkbox',checked:existing?!!existing.multiple:false});
  const countWrap=el('div',{});
  const count=el('input',{type:'number',min:'1',value:existing&&existing.multiple?existing.count:2});
  countWrap.append(el('label',{class:'field'},'Количество платежей'),count);
  function syncCount(){countWrap.style.display=multi.checked?'block':'none';}
  multi.onchange=syncCount;

  const save=el('button',{class:'btn',textContent:'Сохранить',style:'margin-top:18px'});
  save.onclick=async()=>{
    const requisites=req.value.trim();
    const amount=amt.value.trim().replace(',', '.');
    if(!requisites){toast('Заполните реквизиты');req.focus();return;}
    if(!/^\d+(\.\d+)?$/.test(amount)||parseFloat(amount)<=0){toast('Сумма — только положительное число');amt.focus();return;}
    const block={
      id:existing?existing.id:undefined,
      name:existing?existing.name:('Платеж '+((d.payments||[]).length+1)),
      requisites, amount, multiple:multi.checked,
      count:multi.checked?Math.max(1,parseInt(count.value,10)||1):1,
    };
    const payments=(d.payments||[]).slice();
    if(isNew)payments.push(block); else payments[idx]=block;
    save.disabled=true;save.textContent='Сохранение…';
    const {code,data}=await api('POST',`/api/mini/device/${d.id}/payments`,{payments});
    save.disabled=false;save.textContent='Сохранить';
    if(code===200){STATE=data.state;toast('Сохранено');back();}
    else if(data.error==='invalid_amount')toast('Сумма — только число');
    else if(data.error==='empty_requisites')toast('Заполните реквизиты');
    else toast('Ошибка сохранения');
  };

  const card=el('div',{class:'card'},
    el('label',{class:'field'},'Реквизиты'),req,
    el('label',{class:'field'},'Сумма'),amt,
    el('div',{class:'row between',style:'margin-top:16px'},
      el('div',{class:'grow'},el('div',{},'Несколько платежей на этот реквизит с той же суммой')),swWrap(multi)),
    el('div',{class:'tiny muted',style:'margin-top:6px'},'Если сумма или реквизит отличается — добавьте ещё одну отправку.'),
    countWrap, save);
  c.append(card);
  syncCount();

  if(!isNew){
    c.append(el('button',{class:'btn danger',textContent:'Удалить платёж',onclick:async()=>{
      const payments=(d.payments||[]).slice();payments.splice(idx,1);
      const {code,data}=await api('POST',`/api/mini/device/${d.id}/payments`,{payments});
      if(code===200){STATE=data.state;toast('Платёж удалён');back();}else toast('Ошибка');
    }}));
  }
}

  {
    const st=ADMIN_DATA.settings||{probeEnabled:false,probeEligible:0};
    const psw=el('input',{type:'checkbox',checked:!!st.probeEnabled});
    psw.onchange=async()=>{
      const {code}=await api('POST','/api/admin/probe',{enabled:psw.checked});
      if(code===200){await loadAdmin();render();toast(psw.checked?'Автозондирование включено':'Автозондирование выключено');}
      else{toast('Ошибка');psw.checked=!psw.checked;}
    };
    c.append(el('div',{class:'card'},el('div',{class:'row between'},
      el('div',{class:'grow'},el('b',{},'📡 Автопоиск сигнала (пул)'),
        el('div',{class:'small muted',style:'margin-top:4px'},'Активные устройства на связи сами шлют пробные SMS (до 3/час каждое) и ловят «символ». Поймавший запускает работу у всех с включённым сигналом.'),
        el('div',{class:'tiny muted',style:'margin-top:4px'},`Сейчас подходящих устройств: ${st.probeEligible||0}`)),
      swWrap(psw))));
  }

  // Successful ("успешно") payments summary
  if(ADMIN_PAY){
    const t=ADMIN_PAY.total||{count:0,sum:0};
    const card=el('div',{class:'card'});
    card.append(el('div',{class:'row between'},
      el('div',{},el('b',{},'💸 Ушедшие платежи'),el('div',{class:'small muted'},'по которым пришло «успешно»')),
      el('div',{style:'text-align:right'},el('div',{style:'font-size:19px;font-weight:800;color:var(--green-dark)'},money(t.sum)),
        el('div',{class:'tiny muted'},`${t.count} шт.`))));
    // per-token breakdown
    if((ADMIN_PAY.byToken||[]).length){
      const bt=el('div',{class:'hidden',style:'margin-top:8px;border-top:1px solid var(--line);padding-top:8px'});
      ADMIN_PAY.byToken.forEach(x=>bt.append(el('div',{class:'kv',style:'margin-top:3px'},`${x.comment||x.tokenId}: `,el('b',{},money(x.sum)),` · ${x.count} шт.`)));
      const recent=el('div',{class:'hidden',style:'margin-top:8px'});
      (ADMIN_PAY.recent||[]).slice(0,100).forEach(r=>{
        const d=new Date(r.at).toLocaleString('ru-RU');
        recent.append(el('div',{class:'tiny',style:'margin-top:4px;color:var(--muted)'},`${d} · ${r.deviceName}: `,el('b',{style:'color:var(--ink)'},`${r.requisites}=${r.amount}`),r.tokenComment?` (${r.tokenComment})`:''));
      });
      const tgl=el('button',{class:'btn ghost small',textContent:'▾ Разбивка и последние',style:'margin-top:6px'});
      tgl.onclick=()=>{const open=bt.classList.toggle('hidden')===false;recent.classList.toggle('hidden',!open);tgl.textContent=(open?'▴':'▾')+' Разбивка и последние';};
      card.append(tgl,bt,recent);
    }
    c.append(card);
  }

  // Signal webhook (MacroDroid "символ") hit log
  if(ADMIN_SIGNALS){
    const card=el('div',{class:'card'});
    card.append(el('div',{class:'row between'},
      el('div',{},el('b',{},'📡 Логи сигналов'),el('div',{class:'small muted'},'каждый вызов вебхука «символ» (MacroDroid)')),
      el('div',{style:'text-align:right'},el('div',{style:'font-size:19px;font-weight:800'},String(ADMIN_SIGNALS.total||0)),
        el('div',{class:'tiny muted'},'всего'))));
    const list=ADMIN_SIGNALS.recent||[];
    if(list.length===0){
      card.append(el('div',{class:'small muted',style:'margin-top:8px'},'Пока пусто — сигналов не было.'));
    }else{
      const box=el('div',{class:'hidden',style:'margin-top:8px;border-top:1px solid var(--line);padding-top:8px'});
      const resultLabel={started:'запущен',already_running:'уже работал',schedule_active:'идёт расписание',invalid:'токен недействителен'};
      const resultColor={started:'var(--green-dark)',invalid:'var(--danger)'};
      list.slice(0,100).forEach(x=>{
        const d=new Date(x.at).toLocaleString('ru-RU');
        const row=el('div',{class:'tiny',style:'margin-top:8px;color:var(--muted)'});
        row.append(`${d} · ${x.ip||'?'} · `,el('b',{style:'color:var(--ink)'},`старт ${x.started}`),`, пропуск ${x.skipped}`);
        if((x.tokens||[]).length){
          const detail=el('div',{style:'margin-top:2px;opacity:.9'});
          x.tokens.forEach((tk,i)=>{
            detail.append(el('span',{style:`color:${resultColor[tk.result]||'var(--muted)'}`},
              `${tk.comment} (${resultLabel[tk.result]||tk.result})`), i<x.tokens.length-1?', ':'');
          });
          row.append(detail);
        }
        box.append(row);
      });
      const tgl=el('button',{class:'btn ghost small',textContent:'▾ Последние вызовы',style:'margin-top:6px'});
      tgl.onclick=()=>{const open=box.classList.toggle('hidden')===false;tgl.textContent=(open?'▴':'▾')+' Последние вызовы';};
      card.append(tgl,box);
    }
    c.append(card);
  }

  // create token
  const comment=el('input',{type:'text',placeholder:'Кому выдан (комментарий)'});
  const days=el('input',{type:'number',value:'30',min:'0'});
  const lim=el('input',{type:'number',value:'1',min:'0'});
  const createBtn=el('button',{class:'btn',textContent:'Создать токен',style:'margin-top:12px'});
  createBtn.onclick=async()=>{
    const {code}=await api('POST','/api/admin/token',{comment:comment.value,days:parseInt(days.value,10)||0,deviceLimit:parseInt(lim.value,10)||0});
    if(code===200){await loadAdmin();render();toast('Токен создан');}else toast('Ошибка');
  };
  c.append(el('div',{class:'card'},el('b',{},'Новый токен'),
    el('label',{class:'field'},'Комментарий'),comment,
    el('div',{class:'row',style:'gap:10px;margin-top:6px'},
      el('div',{class:'grow'},el('label',{class:'field'},'Срок (дней, 0=∞)'),days),
      el('div',{class:'grow'},el('label',{class:'field'},'Устройств'),lim)),
    createBtn));

  // token list
  (ADMIN_DATA.tokens||[]).forEach(t=>c.append(adminTokenCard(t)));
}

function adminTokenCard(t){
  const card=el('div',{class:'card'});
  const st=t.enabled?(t.expired?el('span',{class:'badge err'},'истёк'):el('span',{class:'badge on'},'включён')):el('span',{class:'badge off'},'выключен');
  card.append(el('div',{class:'row between'},
    el('div',{class:'grow'},el('div',{class:'row',style:'gap:8px;flex-wrap:wrap'},
        el('span',{class:'code',style:'font-size:14px'},t.value),
        el('button',{class:'btn sec small',textContent:'Копировать',onclick:()=>copyText(t.value)})),
      el('div',{class:'small muted',style:'margin-top:4px'},t.comment||'—')),st));
  card.append(el('div',{class:'kv',style:'margin-top:8px'},
    `Устройств: ${t.deviceCount}/${t.deviceLimit} · привязано ${t.pairedCount} · активно ${t.activeCount}`));
  card.append(el('div',{class:'kv'},'Срок: ',el('b',{},t.expiresAt?new Date(t.expiresAt).toLocaleDateString('ru-RU'):'бессрочно'),
    ' · Telegram: ',el('b',{},t.telegramId||'—'),t.globalOn?' · ▶ в работе':''));

  // Enter this token's cabinet as its owner (edit schedule / devices / signal…).
  card.append(el('button',{class:'btn small',style:'margin-top:10px',
    textContent:'🔑 Войти в кабинет',onclick:()=>enterCabinet(t.id, t.comment||t.value)}));

  const quota=el('input',{type:'number',value:t.deviceLimit,min:'0',style:'width:70px'});
  const extend=el('input',{type:'number',value:'30',style:'width:70px'});
  const act=el('div',{class:'row',style:'gap:6px;flex-wrap:wrap;margin-top:10px'});
  [
    quota,el('button',{class:'btn sec small',textContent:'Устр.',onclick:async()=>{const {code}=await api('POST',`/api/admin/token/${t.id}/quota`,{deviceLimit:parseInt(quota.value,10)||0});if(code===200){await loadAdmin();render();toast('Лимит обновлён');}}}),
    extend,el('button',{class:'btn sec small',textContent:'Дней',onclick:async()=>{const {code}=await api('POST',`/api/admin/token/${t.id}/extend`,{days:parseInt(extend.value,10)||0});if(code===200){await loadAdmin();render();toast('Срок обновлён');}}}),
    el('button',{class:'btn sec small',textContent:t.enabled?'Выключить':'Включить',onclick:async()=>{const {code}=await api('POST',`/api/admin/token/${t.id}/toggle`,{});if(code===200){await loadAdmin();render();}}}),
    t.telegramId?el('button',{class:'btn sec small',textContent:'Отвязать TG',onclick:async()=>{const {code}=await api('POST',`/api/admin/token/${t.id}/unbind`,{});if(code===200){await loadAdmin();render();toast('Отвязано');}}}):null,
    el('button',{class:'btn danger small',textContent:'Удалить',onclick:()=>confirmAction(`Удалить токен «${t.comment||t.value}» и все его устройства?`,async()=>{const {code}=await api('DELETE',`/api/admin/token/${t.id}`);if(code===200){await loadAdmin();render();toast('Удалено');}})})
  ].filter(Boolean).forEach(n=>act.append(n));
  card.append(act);

  // Expandable: schedule (по чему начинается работа) + each device's payments.
  const details=el('div',{class:'hidden',style:'margin-top:10px;border-top:1px solid var(--line);padding-top:8px'});
  const sc=t.schedule||{};
  const winTxt=(sc.windows&&sc.windows.length)?sc.windows.map(w=>secToTime(w.startSec)+'–'+secToTime(w.endSec)).join(', '):'нет';
  details.append(el('div',{class:'kv'},'📅 Расписание: ',
    el('b',{},`интервал ${sc.intervalSec||'—'}с`),`, окна: `,el('b',{},winTxt),
    sc.repeatDaily?', ежедневно':'', sc.startAtMillis?(', старт '+new Date(sc.startAtMillis).toLocaleString('ru-RU')):''));
  const latestVc=(ADMIN_DATA&&ADMIN_DATA.latestVersionCode)||0;
  (t.devices||[]).forEach(d=>{
    const pays=(d.payments||[]).map(p=>`${p.requisites}=${p.amount}`+(p.multiple?`×${p.count}`:'')).join('; ')||'нет платежей';
    const vc=d.appVersionCode||0;
    const vcNode=vc?
      (latestVc&&vc<latestVc?el('span',{style:'color:var(--danger)'},` · ⚠ устар. (v${vc}, актуальна v${latestVc})`):el('span',{class:'muted'},` · v${vc}`)):
      el('span',{style:'color:var(--danger)'},' · ⚠ версия неизвестна (очень старый APK)');
    details.append(el('div',{class:'kv',style:'margin-top:5px'},`📱 ${d.name}${d.active?'':' (неактивно)'}: `,el('b',{},pays),vcNode));
  });
  const toggle=el('button',{class:'btn ghost small',textContent:'▾ Расписание и платежи',style:'margin-top:6px'});
  toggle.onclick=()=>{const open=details.classList.toggle('hidden')===false;toggle.textContent=(open?'▴':'▾')+' Расписание и платежи';};
  card.append(toggle,details);
  return card;
}

// ---------- Flows ----------
function modal(node){const bd=el('div',{class:'backdrop'});bd.onclick=(e)=>{if(e.target===bd)bd.remove();};
  const mm=el('div',{class:'modal'});mm.append(node);bd.append(mm);document.body.append(bd);return bd;}
function confirmAction(text,onYes){
  if(TG&&TG.showConfirm){TG.showConfirm(text,(ok)=>{if(ok)onYes();});return;}
  const yes=el('button',{class:'btn danger',textContent:'Да'});
  const no=el('button',{class:'btn ghost',textContent:'Отмена',style:'margin-top:6px'});
  const node=el('div',{},el('b',{},'Подтверждение'),el('div',{class:'small muted',style:'margin:8px 0 14px'},text),yes,no);
  const bd=modal(node);
  yes.onclick=()=>{bd.remove();onYes();};
  no.onclick=()=>bd.remove();
}

function addDeviceFlow(){
  const input=el('input',{type:'text',placeholder:'Например: Основной'});
  const addb=el('button',{class:'btn',textContent:'Добавить'});
  const cancel=el('button',{class:'btn ghost',textContent:'Отмена',style:'margin-top:6px'});
  const node=el('div',{},el('b',{},'Новое устройство'),el('label',{class:'field'},'Название'),input,el('div',{style:'height:14px'}),addb,cancel);
  const bd=modal(node);
  cancel.onclick=()=>bd.remove();
  addb.onclick=async()=>{
    const name=input.value.trim()||'Устройство';
    const {code,data}=await api('POST','/api/mini/device',{name});bd.remove();
    if(code===200){STATE=data.state;render();go('device',{id:data.device.id});toast('Покажите QR телефону');}
    else if(data.error==='quota_exceeded'){if(data.state)STATE=data.state;render();toast('Достигнут лимит устройств');}
    else toast('Ошибка');
  };
  setTimeout(()=>input.focus(),50);
}

function deleteDeviceFlow(d){
  confirmAction(`Удалить устройство «${d.name}»?`,async()=>{
    const {code,data}=await api('DELETE',`/api/mini/device/${d.id}`);
    if(code===200){STATE=data.state;toast('Устройство удалено');reset('home');}else toast('Ошибка');
  });
}

function deletePaymentFlow(d,idx){
  const p=(d.payments||[])[idx];
  confirmAction(`Удалить «${(p&&p.name)||'платёж'}»?`,async()=>{
    const payments=(d.payments||[]).slice(); payments.splice(idx,1);
    const {code,data}=await api('POST',`/api/mini/device/${d.id}/payments`,{payments});
    if(code===200){STATE=data.state;render();toast('Платёж удалён');}else toast('Ошибка');
  });
}

// ---------- QR + time helpers ----------
function renderQr(container,text){try{const qr=qrcode(0,'M');qr.addData(text);qr.make();container.innerHTML=qr.createSvgTag({cellSize:6,margin:2,scalable:true});}catch(e){container.textContent='Не удалось построить QR';}}
function timeToSec(v){if(!v)return 0;const p=v.split(':').map(Number);return (p[0]||0)*3600+(p[1]||0)*60+(p[2]||0);}
function secToTime(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return [h,m,x].map(n=>String(n).padStart(2,'0')).join(':');}
// Guaranteed hh:mm:ss selector (three number fields) — seconds work everywhere.
function timeTriple(totalSec){
  const clamp=(el,max)=>{el.oninput=()=>{el.value=el.value.replace(/[^0-9]/g,'').slice(0,2);};};
  const h=el('input',{type:'number',inputmode:'numeric',min:'0',max:'23',class:'tnum',value:Math.floor(totalSec/3600)});
  const m=el('input',{type:'number',inputmode:'numeric',min:'0',max:'59',class:'tnum',value:Math.floor((totalSec%3600)/60)});
  const s=el('input',{type:'number',inputmode:'numeric',min:'0',max:'59',class:'tnum',value:totalSec%60});
  const wrap=el('span',{class:'trow'},h,el('span',{class:'tsep'},':'),m,el('span',{class:'tsep'},':'),s);
  wrap._get=()=>{
    const H=Math.min(23,Math.max(0,parseInt(h.value,10)||0));
    const M=Math.min(59,Math.max(0,parseInt(m.value,10)||0));
    const S=Math.min(59,Math.max(0,parseInt(s.value,10)||0));
    return H*3600+M*60+S;
  };
  return wrap;
}

// ---------- Live refresh (home only, does not disturb editing) ----------
let LAST_STATE_JSON='';
setInterval(async()=>{
  if(view.name!=='home'||!STATE||!STATE.valid||document.querySelector('.backdrop'))return;
  // Don't poll while the user is changing something, so a stale snapshot can't
  // overwrite a just-made toggle ("switches turn on by themselves").
  if(WRITES_IN_FLIGHT>0)return;
  const started=Date.now();
  const {code,data}=await api('GET','/api/mini/state');
  if(code!==200||data.needToken)return;
  // A change happened while this poll was in flight → its result is stale, drop it.
  if(WRITES_IN_FLIGHT>0||LAST_WRITE_AT>=started)return;
  IS_ADMIN=!!data.isAdmin;
  const j=JSON.stringify(data.state);
  if(j===LAST_STATE_JSON)return; // nothing changed → don't rebuild (no toggle flicker)
  LAST_STATE_JSON=j;
  STATE=data.state;
  render();
},8000);

load();
</script>
