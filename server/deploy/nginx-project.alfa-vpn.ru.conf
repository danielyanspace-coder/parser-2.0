# Отдельный server-блок для ПОДДОМЕНА — основной сайт alfa-vpn.ru и VPN не трогаются.
# Положить в /etc/nginx/sites-available/project.alfa-vpn.ru и включить симлинком в sites-enabled.
# HTTPS-строчки добавит certbot автоматически (см. DEPLOY.md).

server {
    listen 80;
    server_name project.alfa-vpn.ru;

    location / {
        proxy_pass http://127.0.0.1:8090;   # PORT из .env
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ВАЖНО: устройства держат «спящий» long-poll до ~25 c. Не рвём его раньше.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
